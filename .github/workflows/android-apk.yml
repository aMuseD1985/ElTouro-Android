name: Android APK

# Baut die ElTouro-App als installierbare Test-APK – bei jedem Push (jeder Branch) und von Hand:
# Actions → Android APK → Run workflow. Vorher laufen die JVM-Unit-Tests. Die APK steht danach als Artefakt
# "eltouro-apk" am Lauf, bei roten Tests der Testbericht als "eltouro-tests". In diesem Repo wird nichts deployt.
# Die App lädt die Web-App von der angegebenen Adresse (Standard: Testserver).

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Adresse der Web-App, die die APK lädt'
        default: 'https://test.eltouro.de'
  push:
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:

jobs:
  apk:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26.04 from 2026-10-19, the Android SDK layout may differ
    env:
      ELTOURO_URL: ${{ github.event.inputs.url || 'https://test.eltouro.de' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK vorbereiten (auf dem Runner vorhanden)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" | tail -3

      - name: Capacitor synchronisieren
        run: |
          npm ci
          npx cap sync android

      - name: Unit-Tests und APK bauen
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee ../build.log

      # Kotlin errors/warnings and the test count as annotations – readable through the API without the raw log
      - name: Ergebnis als Annotations
        if: always()
        run: |
          grep -E '^e: ' build.log | head -10 | sed -E 's#^e: file://[^ ]*/android/app/src/#e: #' | while IFS= read -r l; do echo "::error::$l"; done || true
          grep -E '^w: ' build.log | head -10 | sed -E 's#^w: file://[^ ]*/android/app/src/#w: #' | while IFS= read -r l; do echo "::warning::$l"; done || true
          grep -E '^(FAILURE|\* What went wrong)' -A3 build.log | head -8 | tr '\n' ' ' | sed 's/^/::error::/' || true
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t = f = s = 0
          for x in glob.glob('android/app/build/test-results/testDebugUnitTest/*.xml'):
              r = ET.parse(x).getroot()
              t += int(r.get('tests', 0)); f += int(r.get('failures', 0)) + int(r.get('errors', 0)); s += int(r.get('skipped', 0))
              for c in r.iter('testcase'):
                  for e in list(c.findall('failure')) + list(c.findall('error')):
                      print(f"::error::{c.get('classname')}.{c.get('name')}: {(e.get('message') or '')[:200]}")
          print(f"::notice::Unit-Tests: {t} gelaufen, {f} fehlgeschlagen, {s} übersprungen")
          PY
          echo "::notice::APK versionCode $((1000 + GITHUB_RUN_NUMBER)), Web-App $ELTOURO_URL"

      - name: Testbericht bei Fehlern
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: eltouro-tests
          path: android/app/build/reports/tests/
          retention-days: 14

      - uses: actions/upload-artifact@v5
        with:
          name: eltouro-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
